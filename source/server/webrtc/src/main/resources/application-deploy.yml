spring:
  application:
    name: webrtc

  datasource:
    url: jdbc:postgresql://webrtc-postgres:5432/webrtc
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

sfu:
  base-url: http://webrtc-sfu:8090

logging:
  file:
    name: /var/log/springboot/webrtc.log
  level:
    root: INFO
